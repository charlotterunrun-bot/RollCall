name: RollCall v2 release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to validate and package
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate source and existing tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify version, annotated tag, and v1 baseline
        id: validate
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi

          version="$(awk -F '"' '/^__version__ = / {print $2; exit}' src/version.py)"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG" 2>/dev/null || true)" = tag
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_commit" = "$SOURCE_SHA"

          test "$(git rev-parse refs/tags/v1.0.0)" = eafa13b6fedd69cc5b47b39d08826e181f97d221
          test "$(git rev-parse refs/tags/v1.0.0^{})" = 4832fee5d3866e823122f2e591dd732bb0824f88

          while IFS= read -r tracked_path; do
            case "$tracked_path" in
              record.xlsx|config.json|RollCallRecord/*|.rollcall-backups/*|*.auto.bak|*.manual.bak|*.pre_restore.bak|*.upgrade.bak)
                echo "tracked user data is forbidden: $tracked_path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files)

          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  native-build:
    name: Run native tests and packages
    needs: preflight
    uses: ./.github/workflows/test.yml
    secrets: inherit

  draft-release:
    name: Assemble complete draft release
    needs:
      - preflight
      - native-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      NOTES_FILE: docs/release-notes-v2.0.0.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
      - name: Verify native assets and write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NOTES_FILE"
          mkdir -p .tmp/release-assets
          windows_source="$(find release-artifacts -type f -name "RollCall-${VERSION}-Windows-x64.exe" -print -quit)"
          macos_source="$(find release-artifacts -type f -name "RollCall-${VERSION}-macOS-arm64.zip" -print -quit)"
          test -n "$windows_source"
          test -n "$macos_source"
          test "$(find release-artifacts -type f -name "RollCall-${VERSION}-Windows-x64.exe" | wc -l)" -eq 1
          test "$(find release-artifacts -type f -name "RollCall-${VERSION}-macOS-arm64.zip" | wc -l)" -eq 1
          cp "$windows_source" ".tmp/release-assets/RollCall-${VERSION}-Windows-x64.exe"
          cp "$macos_source" ".tmp/release-assets/RollCall-${VERSION}-macOS-arm64.zip"
          (
            cd .tmp/release-assets
            sha256sum "RollCall-${VERSION}-Windows-x64.exe" "RollCall-${VERSION}-macOS-arm64.zip" > SHA256SUMS.txt
          )
          test -s .tmp/release-assets/SHA256SUMS.txt
      - name: Create or update draft without touching a published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            ".tmp/release-assets/RollCall-${VERSION}-Windows-x64.exe"
            ".tmp/release-assets/RollCall-${VERSION}-macOS-arm64.zip"
            ".tmp/release-assets/SHA256SUMS.txt"
          )
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/rollcall-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/rollcall-release.json)" = true
            while IFS= read -r old_asset; do
              case "$old_asset" in
                "RollCall-${VERSION}-Windows-x64.exe"|"RollCall-${VERSION}-macOS-arm64.zip"|SHA256SUMS.txt)
                  gh release delete-asset "$RELEASE_TAG" "$old_asset" --yes
                  ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release edit "$RELEASE_TAG" --draft --title "RollCall $RELEASE_TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "RollCall $RELEASE_TAG" --notes-file "$NOTES_FILE"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}"
