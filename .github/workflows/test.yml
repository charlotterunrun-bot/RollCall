name: Test and native packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt
      - run: python -m pytest -q

  windows-package:
    runs-on: windows-2025
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt
      - run: python -c "import platform,sys; assert sys.platform == 'win32'; assert platform.machine().lower() in ('amd64','x86_64'); print(sys.version); print(platform.machine())"
      - run: ./scripts/build_windows.ps1
        shell: pwsh
      - run: python scripts/run_packaged_smoke.py dist/RollCall.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RollCall-2.0.0-Windows-x64
          path: dist/RollCall-2.0.0-Windows-x64.exe
          if-no-files-found: error

  macos-package:
    runs-on: macos-15
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt
      - run: python -m pytest -q
      - run: |
          test "$(uname -m)" = arm64
          python -c "import platform,sys; assert sys.platform == 'darwin'; assert platform.machine() == 'arm64'; print(sys.version); print(platform.machine())"
      - run: bash scripts/build_macos.sh
      - run: python scripts/run_packaged_smoke.py dist/RollCall.app/Contents/MacOS/RollCall
      - run: codesign --verify --deep --strict dist/RollCall.app
      - run: |
          while IFS= read -r -d '' binary; do
            description="$(file "$binary")"
            case "$description" in
              *Mach-O*) echo "$description" | grep -q arm64 || { echo "non-arm64 Mach-O: $description"; exit 1; } ;;
            esac
          done < <(find dist/RollCall.app -type f \( -perm -111 -o -name '*.dylib' -o -name '*.so' \) -print0)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RollCall-2.0.0-macOS-arm64
          path: dist/RollCall-2.0.0-macOS-arm64.zip
          if-no-files-found: error
