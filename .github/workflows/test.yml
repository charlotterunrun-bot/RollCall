name: Test and native packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt
      - run: New-Item -ItemType Directory -Force .tmp | Out-Null; python -m pytest -q --junitxml=.tmp/windows-tests.xml
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: RollCall-Windows-test-results
          path: .tmp/windows-tests.xml
          if-no-files-found: warn

  windows-package:
    runs-on: windows-2025
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt
      - run: $version = python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)"; "ROLLCALL_VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh
      - run: python -c "import platform,sys; assert sys.platform == 'win32'; assert platform.machine().lower() in ('amd64','x86_64'); print(sys.version); print(platform.machine())"
      - run: python scripts/write_dependency_receipt.py .tmp/windows-dependency-receipt.json
      - run: ./scripts/build_windows.ps1
        shell: pwsh
      - run: python scripts/run_packaged_smoke.py dist/RollCall.exe --output-dir .tmp/windows-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: RollCall-Windows-evidence-${{ env.ROLLCALL_VERSION }}
          path: |
            .tmp/windows-dependency-receipt.json
            .tmp/windows-smoke/run/**
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RollCall-Windows-x64-${{ env.ROLLCALL_VERSION }}
          path: dist/RollCall-*-Windows-x64.exe
          if-no-files-found: error

  macos-package:
    runs-on: macos-15
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt --constraint constraints.txt
      - run: |
          version=$(python -c 'import sys; sys.path.insert(0, "src"); from version import __version__; print(__version__)')
          echo "ROLLCALL_VERSION=$version" >> "$GITHUB_ENV"
      - run: mkdir -p .tmp && python -m pytest -q --junitxml=.tmp/macos-tests.xml
      - run: python scripts/write_dependency_receipt.py .tmp/macos-dependency-receipt.json
      - run: |
          test "$(uname -m)" = arm64
          python -c "import platform,sys; assert sys.platform == 'darwin'; assert platform.machine() == 'arm64'; print(sys.version); print(platform.machine())"
      - run: bash scripts/build_macos.sh
      - run: python scripts/run_packaged_smoke.py dist/RollCall.app/Contents/MacOS/RollCall --output-dir .tmp/macos-smoke
      - run: codesign --verify --deep --strict dist/RollCall.app
      - run: |
          while IFS= read -r -d '' binary; do
            description="$(file "$binary")"
            case "$description" in
              *Mach-O*)
                arches="$(lipo -archs "$binary")"
                test "$arches" = arm64 || { echo "non-thin-arm64 Mach-O: $binary ($arches)"; exit 1; }
                ;;
            esac
          done < <(find dist/RollCall.app -type f \( -perm -111 -o -name '*.dylib' -o -name '*.so' \) -print0)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: RollCall-macOS-arm64-${{ env.ROLLCALL_VERSION }}
          path: dist/RollCall-*-macOS-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: RollCall-macOS-evidence-${{ env.ROLLCALL_VERSION }}
          path: |
            .tmp/macos-dependency-receipt.json
            .tmp/macos-tests.xml
            .tmp/macos-smoke/run/**
          include-hidden-files: true
          if-no-files-found: warn
